trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Validate
  displayName: Stage 1 - Validate Application

  jobs:

  - job: ValidatePython
    displayName: Validate Python Application

    steps:

    - task: UsePythonVersion@0
      displayName: Use Python 3.12
      inputs:
        versionSpec: '3.12'

    - script: |
        python --version
        python -m pip install --upgrade pip
      displayName: Setup Python

    - script: |
        python -m pip install -r requirements.txt
      displayName: Install Dependencies

    - script: |
        python -m py_compile app.py
      displayName: Validate Application


- stage: DockerBuild
  displayName: Stage 2 - Build Docker Image

  dependsOn: Validate

  jobs:

  - job: BuildImage
    displayName: Build Finance App Docker Image

    steps:

    - script: |
        docker --version
      displayName: Check Docker

    - script: |
        docker build -t finance-app:latest .
      displayName: Build Docker Image